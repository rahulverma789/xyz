<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .glass-effect {
            backdrop-filter: blur(20px);
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .movie-card {
            transition: all 0.3s ease;
            transform: translateY(0);
        }
        .movie-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .dark-gradient {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        }
        .search-glow:focus {
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.3);
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'fade-in': 'fadeIn 0.5s ease-in-out',
                        'slide-up': 'slideUp 0.3s ease-out'
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(100px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' }
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="dark-gradient min-h-screen text-white">
    <!-- Header -->
    <header class="sticky top-0 z-50 glass-effect">
        <nav class="container mx-auto px-6 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="p-2 bg-gradient-to-r from-purple-500 to-pink-500 rounded-xl">
                        <i data-lucide="film" class="w-6 h-6"></i>
                    </div>
                    <h1 class="text-2xl font-bold bg-gradient-to-r from-purple-400 to-pink-400 bg-clip-text text-transparent">
                        Movie Explorer
                    </h1>
                </div>
                <div class="flex items-center space-x-4">
                    <button id="watchlist-btn" class="relative p-2 bg-gray-800/50 rounded-lg hover:bg-gray-700/50 transition-colors">
                        <i data-lucide="bookmark" class="w-5 h-5"></i>
                        <span id="watchlist-count" class="absolute -top-2 -right-2 bg-red-500 text-xs rounded-full w-5 h-5 flex items-center justify-center hidden">0</span>
                    </button>
                </div>
            </div>
        </nav>
    </header>

    <div class="container mx-auto px-6 py-8">
        <!-- Search Section -->
        <section class="mb-12">
            <div class="max-w-2xl mx-auto">
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i data-lucide="search" class="w-5 h-5 text-gray-400"></i>
                    </div>
                    <input 
                        id="search-input" 
                        type="text" 
                        placeholder="Search for movies..."
                        class="w-full pl-12 pr-4 py-4 bg-gray-800/50 border border-gray-700 rounded-2xl focus:outline-none search-glow focus:border-purple-500 transition-all text-white placeholder-gray-400"
                    >
                </div>
            </div>
        </section>

        <!-- Search Results -->
        <section id="search-results" class="mb-12 hidden">
            <h2 class="text-2xl font-bold mb-6 flex items-center">
                <i data-lucide="search" class="w-6 h-6 mr-3 text-purple-400"></i>
                Search Results
            </h2>
            <div id="search-movies" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-6"></div>
        </section>

        <!-- Recommendations -->
        <section id="recommendations" class="mb-12 hidden">
            <h2 class="text-2xl font-bold mb-6 flex items-center">
                <i data-lucide="target" class="w-6 h-6 mr-3 text-green-400"></i>
                You Might Also Like
            </h2>
            <div id="recommendation-movies" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-6 gap-6"></div>
        </section>

        <!-- Trending Movies -->
        <section class="mb-12">
            <h2 class="text-2xl font-bold mb-6 flex items-center">
                <i data-lucide="trending-up" class="w-6 h-6 mr-3 text-red-400"></i>
                Trending Now
            </h2>
            <div id="trending-movies" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-6 gap-6">
                <div class="movie-card bg-gray-800/30 rounded-2xl p-4 animate-pulse">
                    <div class="bg-gray-700 rounded-xl h-64 mb-4"></div>
                    <div class="bg-gray-700 h-4 rounded mb-2"></div>
                    <div class="bg-gray-700 h-3 rounded w-3/4"></div>
                </div>
            </div>
        </section>

        <!-- Top Rated Movies -->
        <section class="mb-12">
            <h2 class="text-2xl font-bold mb-6 flex items-center">
                <i data-lucide="award" class="w-6 h-6 mr-3 text-yellow-400"></i>
                Top Rated
            </h2>
            <div id="toprated-movies" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-6 gap-6">
                <div class="movie-card bg-gray-800/30 rounded-2xl p-4 animate-pulse">
                    <div class="bg-gray-700 rounded-xl h-64 mb-4"></div>
                    <div class="bg-gray-700 h-4 rounded mb-2"></div>
                    <div class="bg-gray-700 h-3 rounded w-3/4"></div>
                </div>
            </div>
        </section>

        <!-- Now Playing -->
        <section class="mb-12">
            <h2 class="text-2xl font-bold mb-6 flex items-center">
                <i data-lucide="play-circle" class="w-6 h-6 mr-3 text-green-400"></i>
                Now Playing
            </h2>
            <div id="nowplaying-movies" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-6 gap-6">
                <div class="movie-card bg-gray-800/30 rounded-2xl p-4 animate-pulse">
                    <div class="bg-gray-700 rounded-xl h-64 mb-4"></div>
                    <div class="bg-gray-700 h-4 rounded mb-2"></div>
                    <div class="bg-gray-700 h-3 rounded w-3/4"></div>
                </div>
            </div>
        </section>
    </div>

    <!-- Watchlist Modal -->
    <div id="watchlist-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-gray-900 rounded-3xl p-8 max-w-4xl w-full max-h-[80vh] overflow-y-auto">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-2xl font-bold flex items-center">
                        <i data-lucide="bookmark" class="w-6 h-6 mr-3 text-purple-400"></i>
                        Your Watchlist
                    </h2>
                    <button id="close-modal" class="p-2 bg-gray-800 rounded-lg hover:bg-gray-700 transition-colors">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>
                <div id="watchlist-content" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6">
                    <div class="text-center py-12 col-span-full">
                        <i data-lucide="bookmark" class="w-16 h-16 mx-auto text-gray-600 mb-4"></i>
                        <p class="text-gray-400">Your watchlist is empty</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Movie Detail Modal -->
    <div id="movie-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-gray-900 rounded-3xl p-8 max-w-2xl w-full max-h-[80vh] overflow-y-auto">
                <div id="movie-detail-content">
                    <!-- Movie details will be populated here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const TMDB_API_KEY = "3d3b5cbc09e66409a5686373a4c110e7";
        const TMDB_BASE_URL = "https://api.themoviedb.org/3";
        const IMAGE_BASE_URL = "https://image.tmdb.org/t/p/w500";
        const YOUTUBE_BASE_URL = "https://www.youtube.com/watch?v=";
        
        // Custom API configuration
        const CUSTOM_API_BASE_URL = "http://localhost:8000"; // Update this with your API URL

        // State
        let watchlist = JSON.parse(localStorage.getItem('movieWatchlist') || '[]');
        let genreMap = {};

        // Initialize Lucide icons
        lucide.createIcons();

        // Fetch from custom API
        async function fetchFromCustomAPI(endpoint, params = {}) {
            try {
                const url = new URL(`${CUSTOM_API_BASE_URL}/${endpoint}`);
                Object.keys(params).forEach(key => url.searchParams.append(key, params[key]));
                
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return await response.json();
            } catch (error) {
                console.error(`Error fetching from custom API (${endpoint}):`, error);
                return [];
            }
        }

        // Fetch movie data from TMDB
        async function fetchMoviesFromTMDB(endpoint) {
            try {
                const response = await fetch(`${TMDB_BASE_URL}/${endpoint}?api_key=${TMDB_API_KEY}&language=en-US`);
                const data = await response.json();
                return data.results || [];
            } catch (error) {
                console.error('Error fetching movies from TMDB:', error);
                return [];
            }
        }

        // Get TMDB movie details by ID
        async function getTMDBMovieDetails(movieId) {
            try {
                const response = await fetch(`${TMDB_BASE_URL}/movie/${movieId}?api_key=${TMDB_API_KEY}&language=en-US`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return await response.json();
            } catch (error) {
                console.error('Error fetching movie details from TMDB:', error);
                return null;
            }
        }

        // Get genres from TMDB
        async function getGenres() {
            try {
                const response = await fetch(`${TMDB_BASE_URL}/genre/movie/list?api_key=${TMDB_API_KEY}&language=en-US`);
                const data = await response.json();
                genreMap = data.genres.reduce((acc, genre) => {
                    acc[genre.id] = genre.name;
                    return acc;
                }, {});
            } catch (error) {
                console.error('Error fetching genres:', error);
            }
        }

        // Get poster URL
        function getPosterUrl(path) {
            return path ? `${IMAGE_BASE_URL}${path}` : 'https://via.placeholder.com/300x450/1f2937/9ca3af?text=No+Image';
        }

        // Get trailer
        async function getTrailer(movieId) {
            try {
                const response = await fetch(`${TMDB_BASE_URL}/movie/${movieId}/videos?api_key=${TMDB_API_KEY}`);
                const data = await response.json();
                const trailer = data.results.find(video => video.site === "YouTube" && video.type === "Trailer");
                return trailer ? `${YOUTUBE_BASE_URL}${trailer.key}` : null;
            } catch (error) {
                console.error('Error fetching trailer:', error);
                return null;
            }
        }

        // Combine custom API data with TMDB details
        async function enrichMovieWithTMDB(customMovie) {
            try {
                const tmdbDetails = await getTMDBMovieDetails(customMovie.id);
                if (!tmdbDetails) {
                    return {
                        id: customMovie.id,
                        title: customMovie.title,
                        overview: customMovie.overview || '',
                        poster_path: null,
                        release_date: customMovie.release_date || '',
                        vote_average: customMovie.vote_average_5 || 0,
                        genre_ids: [],
                        genres: customMovie.genres || []
                    };
                }

                return {
                    id: customMovie.id,
                    title: customMovie.title,
                    overview: customMovie.overview || tmdbDetails.overview,
                    poster_path: tmdbDetails.poster_path,
                    backdrop_path: tmdbDetails.backdrop_path,
                    release_date: customMovie.release_date || tmdbDetails.release_date,
                    vote_average: customMovie.vote_average_5 || tmdbDetails.vote_average,
                    runtime: customMovie.runtime || tmdbDetails.runtime,
                    genre_ids: tmdbDetails.genres ? tmdbDetails.genres.map(g => g.id) : [],
                    genres: customMovie.genres || (tmdbDetails.genres ? tmdbDetails.genres.map(g => g.name) : []),
                    popularity: customMovie.popularity_norm || tmdbDetails.popularity,
                    adult: customMovie.adult || tmdbDetails.adult,
                    original_language: tmdbDetails.original_language,
                    budget: tmdbDetails.budget,
                    revenue: tmdbDetails.revenue
                };
            } catch (error) {
                console.error('Error enriching movie with TMDB data:', error);
                return customMovie;
            }
        }

        // Toggle watchlist
        function toggleWatchlist(movie) {
            const index = watchlist.findIndex(item => item.id === movie.id);
            if (index === -1) {
                watchlist.push(movie);
            } else {
                watchlist.splice(index, 1);
            }
            localStorage.setItem('movieWatchlist', JSON.stringify(watchlist));
            updateWatchlistCount();
            updateWatchlistModal();
        }

        // Update watchlist count
        function updateWatchlistCount() {
            const countEl = document.getElementById('watchlist-count');
            if (watchlist.length > 0) {
                countEl.textContent = watchlist.length;
                countEl.classList.remove('hidden');
            } else {
                countEl.classList.add('hidden');
            }
        }

        // Create movie card
        function createMovieCard(movie) {
            const isInWatchlist = watchlist.some(item => item.id === movie.id);
            const genres = movie.genres ? movie.genres.slice(0, 2) : [];
            
            return `
                <div class="movie-card bg-gray-800/30 backdrop-blur-sm rounded-2xl p-4 hover:bg-gray-800/50 transition-all animate-fade-in group">
                    <div class="relative overflow-hidden rounded-xl mb-4">
                        <img src="${getPosterUrl(movie.poster_path)}" alt="${movie.title}" 
                             class="w-full h-64 object-cover transition-transform group-hover:scale-110">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent opacity-0 group-hover:opacity-100 transition-opacity">
                            <div class="absolute bottom-4 left-4 right-4">
                                <button onclick="showMovieDetail(${movie.id})" 
                                        class="w-full bg-white/20 backdrop-blur-sm text-white py-2 rounded-lg hover:bg-white/30 transition-colors flex items-center justify-center">
                                    <i data-lucide="info" class="w-4 h-4 mr-2"></i>
                                    Details
                                </button>
                            </div>
                        </div>
                    </div>
                    <h3 class="font-semibold text-sm mb-2 line-clamp-2" title="${movie.title}">${movie.title}</h3>
                    <div class="flex items-center justify-between text-xs text-gray-400 mb-3">
                        <span class="flex items-center">
                            <i data-lucide="star" class="w-3 h-3 mr-1 text-yellow-400"></i>
                            ${movie.vote_average ? movie.vote_average.toFixed(1) : 'N/A'}
                        </span>
                        <span>${movie.release_date ? new Date(movie.release_date).getFullYear() : 'TBA'}</span>
                    </div>
                    ${genres.length > 0 ? `<div class="flex flex-wrap gap-1 mb-3">
                        ${genres.map(genre => `<span class="px-2 py-1 bg-purple-500/20 text-purple-300 text-xs rounded-full">${genre}</span>`).join('')}
                    </div>` : ''}
                    <button onclick="toggleWatchlist(${JSON.stringify(movie).replace(/"/g, '&quot;')})" 
                            class="w-full py-2 rounded-lg text-sm font-medium transition-colors flex items-center justify-center ${
                                isInWatchlist 
                                    ? 'bg-green-600 hover:bg-green-700 text-white' 
                                    : 'bg-purple-600 hover:bg-purple-700 text-white'
                            }">
                        <i data-lucide="${isInWatchlist ? 'check' : 'plus'}" class="w-4 h-4 mr-2"></i>
                        ${isInWatchlist ? 'In Watchlist' : 'Add to Watchlist'}
                    </button>
                </div>
            `;
        }

        // Show movie detail
        async function showMovieDetail(movieId) {
            const modal = document.getElementById('movie-modal');
            const content = document.getElementById('movie-detail-content');
            
            // Show loading state
            content.innerHTML = `
                <div class="flex items-center justify-center py-12">
                    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-purple-500"></div>
                </div>
            `;
            modal.classList.remove('hidden');
            
            try {
                const movie = await getTMDBMovieDetails(movieId);
                if (!movie) {
                    throw new Error('Movie not found');
                }
                
                const trailer = await getTrailer(movieId);
                
                content.innerHTML = `
                    <div class="flex items-center justify-between mb-6">
                        <h2 class="text-2xl font-bold">${movie.title}</h2>
                        <button onclick="closeMovieModal()" class="p-2 bg-gray-800 rounded-lg hover:bg-gray-700 transition-colors">
                            <i data-lucide="x" class="w-5 h-5"></i>
                        </button>
                    </div>
                    <div class="grid md:grid-cols-3 gap-6">
                        <div class="md:col-span-1">
                            <img src="${getPosterUrl(movie.poster_path)}" alt="${movie.title}" 
                                 class="w-full rounded-xl shadow-lg">
                        </div>
                        <div class="md:col-span-2">
                            <div class="flex items-center gap-4 mb-4">
                                <span class="flex items-center text-yellow-400">
                                    <i data-lucide="star" class="w-4 h-4 mr-1"></i>
                                    ${movie.vote_average ? movie.vote_average.toFixed(1) : 'N/A'}
                                </span>
                                <span class="text-gray-400">${movie.release_date || 'TBA'}</span>
                                <span class="text-gray-400">${movie.runtime ? movie.runtime + ' min' : ''}</span>
                            </div>
                            <div class="flex flex-wrap gap-2 mb-4">
                                ${movie.genres ? movie.genres.map(genre => `<span class="px-3 py-1 bg-purple-500/20 text-purple-300 text-sm rounded-full">${genre.name}</span>`).join('') : ''}
                            </div>
                            <p class="text-gray-300 mb-6">${movie.overview || 'No overview available.'}</p>
                            <div class="flex gap-3">
                                ${trailer ? `<a href="${trailer}" target="_blank" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-lg text-white flex items-center transition-colors">
                                    <i data-lucide="play" class="w-4 h-4 mr-2"></i>
                                    Watch Trailer
                                </a>` : ''}
                                <button onclick="toggleWatchlist(${JSON.stringify(movie).replace(/"/g, '&quot;')})" 
                                        class="bg-purple-600 hover:bg-purple-700 px-4 py-2 rounded-lg text-white flex items-center transition-colors">
                                    <i data-lucide="bookmark" class="w-4 h-4 mr-2"></i>
                                    ${watchlist.some(item => item.id === movie.id) ? 'Remove from Watchlist' : 'Add to Watchlist'}
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                
                lucide.createIcons();
            } catch (error) {
                console.error('Error fetching movie details:', error);
                content.innerHTML = `
                    <div class="text-center py-12">
                        <i data-lucide="alert-circle" class="w-16 h-16 mx-auto text-red-400 mb-4"></i>
                        <p class="text-gray-400">Error loading movie details</p>
                        <button onclick="closeMovieModal()" class="mt-4 bg-gray-600 hover:bg-gray-700 px-4 py-2 rounded-lg text-white">
                            Close
                        </button>
                    </div>
                `;
                lucide.createIcons();
            }
        }

        // Close movie modal
        function closeMovieModal() {
            document.getElementById('movie-modal').classList.add('hidden');
        }

        // Display movies
        async function displayMovies(movies, containerId) {
            const container = document.getElementById(containerId);
            if (movies.length === 0) {
                container.innerHTML = '<p class="text-gray-400 text-center col-span-full">No movies found.</p>';
                return;
            }
            
            container.innerHTML = movies.slice(0, 12).map(movie => createMovieCard(movie)).join('');
            lucide.createIcons();
        }

        // Search movies using custom API
        async function searchMovies(query) {
            if (!query.trim()) return;
            
            try {
                // Search using custom API
                const searchResults = await fetchFromCustomAPI('search', { query: query });
                
                if (searchResults.length > 0) {
                    // Enrich with TMDB data
                    const enrichedResults = await Promise.all(
                        searchResults.slice(0, 6).map(movie => enrichMovieWithTMDB(movie))
                    );
                    
                    const searchSection = document.getElementById('search-results');
                    const recommendationsSection = document.getElementById('recommendations');
                    
                    searchSection.classList.remove('hidden');
                    await displayMovies(enrichedResults, 'search-movies');
                    
                    // Get recommendations for the first result
                    if (searchResults[0]) {
                        try {
                            const recommendations = await fetchFromCustomAPI('recommend', { query: searchResults[0].title });
                            if (recommendations.length > 0) {
                                const enrichedRecommendations = await Promise.all(
                                    recommendations.slice(0, 6).map(movie => enrichMovieWithTMDB(movie))
                                );
                                recommendationsSection.classList.remove('hidden');
                                await displayMovies(enrichedRecommendations, 'recommendation-movies');
                            } else {
                                recommendationsSection.classList.add('hidden');
                            }
                        } catch (recError) {
                            console.error('Error fetching recommendations:', recError);
                            recommendationsSection.classList.add('hidden');
                        }
                    }
                } else {
                    document.getElementById('search-results').classList.add('hidden');
                    document.getElementById('recommendations').classList.add('hidden');
                }
            } catch (error) {
                console.error('Error searching movies:', error);
                document.getElementById('search-results').classList.add('hidden');
                document.getElementById('recommendations').classList.add('hidden');
            }
        }

        // Update watchlist modal
        function updateWatchlistModal() {
            const content = document.getElementById('watchlist-content');
            if (watchlist.length === 0) {
                content.innerHTML = `
                    <div class="text-center py-12 col-span-full">
                        <i data-lucide="bookmark" class="w-16 h-16 mx-auto text-gray-600 mb-4"></i>
                        <p class="text-gray-400">Your watchlist is empty</p>
                    </div>
                `;
            } else {
                content.innerHTML = watchlist.map(movie => `
                    <div class="bg-gray-800/30 rounded-2xl p-4">
                        <img src="${getPosterUrl(movie.poster_path)}" alt="${movie.title}" 
                             class="w-full h-64 object-cover rounded-xl mb-3">
                        <h3 class="font-semibold text-sm mb-2">${movie.title}</h3>
                        <button onclick="toggleWatchlist(${JSON.stringify(movie).replace(/"/g, '&quot;')})" 
                                class="w-full bg-red-600 hover:bg-red-700 py-2 rounded-lg text-sm flex items-center justify-center transition-colors">
                            <i data-lucide="trash-2" class="w-4 h-4 mr-2"></i>
                            Remove
                        </button>
                    </div>
                `).join('');
            }
            lucide.createIcons();
        }

        // Event listeners
        document.getElementById('search-input').addEventListener('input', (e) => {
            const query = e.target.value.trim();
            if (query) {
                searchMovies(query);
            } else {
                document.getElementById('search-results').classList.add('hidden');
                document.getElementById('recommendations').classList.add('hidden');
            }
        });

        document.getElementById('watchlist-btn').addEventListener('click', () => {
            document.getElementById('watchlist-modal').classList.remove('hidden');
            updateWatchlistModal();
        });

        document.getElementById('close-modal').addEventListener('click', () => {
            document.getElementById('watchlist-modal').classList.add('hidden');
        });

        document.getElementById('watchlist-modal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) {
                document.getElementById('watchlist-modal').classList.add('hidden');
            }
        });

        document.getElementById('movie-modal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) {
                closeMovieModal();
            }
        });

        // Initialize app
        async function init() {
            await getGenres();
            updateWatchlistCount();
            
            // Load initial data from TMDB for the default sections
            const [trending, topRated, nowPlaying] = await Promise.all([
                fetchMoviesFromTMDB('trending/movie/day'),
                fetchMoviesFromTMDB('movie/top_rated'),
                fetchMoviesFromTMDB('movie/now_playing')
            ]);
            
            await displayMovies(trending, 'trending-movies');
            await displayMovies(topRated, 'toprated-movies');
            await displayMovies(nowPlaying, 'nowplaying-movies');
        }

        // Start the app
        init();
    </script>
</body>
</html>
